name: Bug 报告
description: 报告功能、安全或兼容性问题
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        请勿上传 config.yaml、API 密钥、聊天或角色数据。IP 地址请遮住最后一段。
  - type: input
    id: extension-version
    attributes:
      label: 扩展版本
      placeholder: 例如 0.1.0
    validations:
      required: true
  - type: input
    id: sillytavern-version
    attributes:
      label: SillyTavern 版本
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Android 与 Termux 环境
      description: 请填写 Android 版本、Termux 来源与版本。
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 使用模式
      options:
        - 仅允许单个设备
        - 允许当前可信局域网（/24）
        - 尚未生成命令
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请逐步说明做了什么、看到了什么。
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 已脱敏的完整错误信息
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除密钥、聊天、角色数据和可识别个人身份的信息。
          required: true
